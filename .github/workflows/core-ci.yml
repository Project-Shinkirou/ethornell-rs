name: ShinkiEMU core CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      attribution:
        description: Reviewed, tracked attribution JSON; leave empty to run build/test only
        type: string
        default: ''
      target:
        description: Target to stage when attribution is supplied
        type: choice
        default: x86_64-pc-windows-msvc
        options:
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-linux-android
          - x86_64-linux-android
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios

permissions:
  contents: read

jobs:
  build-test:
    if: inputs.attribution == ''
    name: Build/test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            mode: standalone
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            mode: standalone
          - target: aarch64-apple-darwin
            runner: macos-15
            mode: standalone
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            mode: standalone
          - target: aarch64-linux-android
            runner: ubuntu-24.04
            mode: standalone
          - target: x86_64-linux-android
            runner: ubuntu-24.04
            mode: standalone
          - target: aarch64-apple-ios
            runner: macos-15
            mode: signed-input
          - target: aarch64-apple-ios-sim
            runner: macos-15
            mode: signed-input
          - target: x86_64-apple-ios
            runner: macos-15-intel
            mode: signed-input
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Test the adapter and verify the Cargo build report
        shell: bash
        env:
          CORE_TARGET: ${{ matrix.target }}
          CORE_MODE: ${{ matrix.mode }}
        run: python .shinki/core-ci.py --target "$CORE_TARGET" --mode "$CORE_MODE" --out "$RUNNER_TEMP/core-build-input"

  stage:
    if: github.event_name == 'workflow_dispatch' && inputs.attribution != ''
    uses: Project-Shinkirou/ShinkiEMU-CoreKit/.github/workflows/core-ci.yml@58d00070ebe02030de1cde9e3d91abd696201067
    with:
      corekit-rev: 58d00070ebe02030de1cde9e3d91abd696201067
      runner: ${{ inputs.target == 'x86_64-pc-windows-msvc' && 'windows-2022' || startsWith(inputs.target, 'x86_64-apple-') && 'macos-15-intel' || startsWith(inputs.target, 'aarch64-apple-') && 'macos-15' || 'ubuntu-24.04' }}
      target: ${{ inputs.target }}
      mode: ${{ contains(inputs.target, '-apple-ios') && 'signed-input' || 'standalone' }}
      plugin-id: ethornell-rs
      producer: shinki-emu-ethornell-rs
      attribution: ${{ inputs.attribution }}
      upload: false
