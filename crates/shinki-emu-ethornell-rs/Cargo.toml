[package]
name = "shinki-emu-ethornell-rs"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version = "1.99"
publish = false
build = "build.rs"

[lib]
name = "shinki_emu_ethornell_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
diagnostic-bridge = ["shinki-emu-abi/diagnostic-bridge"]

[dependencies]
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU-CoreKit", rev = "58d00070ebe02030de1cde9e3d91abd696201067" }
ethornell-archive = { path = "../ethornell-archive" }
tracing.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
ethornell-app = { path = "../ethornell-app" }

[target.'cfg(target_os = "android")'.dependencies]
ethornell-app = { path = "../ethornell-app", default-features = false, features = ["host-driven"] }
ndk-context = "0.1.1"
# Keep the shared NDK C++ runtime selected by the former Manager wrapper.
oboe = { version = "=0.6.1", features = ["shared-stdcxx"] }

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU-CoreKit", rev = "58d00070ebe02030de1cde9e3d91abd696201067" }
